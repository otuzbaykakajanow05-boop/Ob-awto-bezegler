
name: Build OB Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir -p app
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          test -n "$ARCHIVE"
          unzip -o "$ARCHIVE" -d app

      - name: Build APK
        run: |
          PROJECT_FILE=$(find app -type f -name pubspec.yaml -print -quit)
          test -n "$PROJECT_FILE"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release --build-dir "$GITHUB_WORKSPACE/build"

      - uses: actions/upload-artifact@v4
        with:
          name: OB-Awto-Bezegleri-APK
          path: build/app/outputs/flutter-apk/app-release.apk
